<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lists 3</title>
        <meta charset="utf-8"/>
    </head>

    <body>
        
        <!--Defines the start and end if the list-->
        <dl> 
            <!--element specifies the definition term-->
             <dt>Triangle</dt>
            <!--element specifies the actual definition-->
            <dd>A three sided shape</dd>
            <dt>Quadrilateral</dt>
            <dd>A four sided shape</dd>
            <dt>Pentagon</dt>
            <dd>A five sided shape</dd>
        </dl>
        
    </body>
</html>
